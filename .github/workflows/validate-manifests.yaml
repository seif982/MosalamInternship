name: Validate Kubernetes Manifests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build and Validate Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install Kubeconform
        env:
          KUBECONFORM_VERSION: 0.6.7
        run: |
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          sudo tar -xzf kubeconform-linux-amd64.tar.gz \
            -C /usr/local/bin kubeconform

          kubeconform -v

      - name: Build and Validate Kustomize Applications
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' kustomization_file; do
            app_dir="$(dirname "$kustomization_file")"

            echo "::group::Validating ${app_dir}"

            kustomize build "$app_dir" | \
              kubeconform -strict -summary -ignore-missing-schemas

            echo "::endgroup::"

          done < <(
            find private-rke2-gitops-platform \
              -type f \
              -name kustomization.yaml \
              -print0
          )
